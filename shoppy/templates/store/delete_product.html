{% extends 'base.html' %}

{% block content %}
<div class="container">
    <h2>Confirm Delete</h2>
    <p>Are you sure you want to delete this product "{{ product.name }}"?</p>
    
    <form method="POST">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete Product</button>
        <a href="{% url 'edit_product' product.id %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
