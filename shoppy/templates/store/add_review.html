{% extends 'base.html' %}

{% block content %}
<div class="review-container">
    <h2>Leave a Review for {{ product.name }}</h2>

    <form method="POST" action="{% url 'add_review' product.id %}">
        {% csrf_token %}

        <div class="form-group">
            <label for="rating">Rating</label>
            <select name="rating" id="rating" required>
                <option value="" disabled selected>Select a rating</option>
                <option value="5">⭐⭐⭐⭐⭐ — Excellent</option>
                <option value="4">⭐⭐⭐⭐ — Good</option>
                <option value="3">⭐⭐⭐ — Average</option>
                <option value="2">⭐⭐ — Poor</option>
                <option value="1">⭐ — Terrible</option>
            </select>
        </div>

        <div class="form-group">
            <label for="comment">Comment</label>
            <textarea name="comment" id="comment" rows="5" placeholder="Share your experience with this product..." required></textarea>
        </div>

        <button type="submit" class="btn-submit">Submit Review</button>
        <a href="{% url 'product_detail' product.id %}" class="btn-cancel">Cancel</a>
    </form>
</div>
{% endblock %}
