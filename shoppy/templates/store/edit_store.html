{% extends "base.html" %}

{% block content %}
<h2>Edit Store</h2>

<form method="POST">
    {% csrf_token %}
    <input type="text" name="name" value="{{ store.name }}" required>
    <button type="submit">Save</button>

    <a href="{% url 'delete_store' store.id %}">
        <button type="button">Delete Store</button>
    </a>

</form>

<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px;">
{% for product in products %}
        <div class="card">
            <h3>{{ product.name }}</h3>
            <p>{{ product.description|truncatewords:10 }}</p>
            <p><strong>R{{ product.price }}</strong></p>

            <a href="{% url 'edit_product' product.id %}">
                <button type="button">Edit Product</button>
            </a>
        </div>
    {% endfor %}
</div>

{% endblock %}
