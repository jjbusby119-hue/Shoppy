{% extends 'base.html' %}

{% block content %}
<div class="container">
    <h2>Confirm Delete</h2>
    <p>Are you sure you want to delete the store "{{ store.name }}"?</p>
    <p>This action cannot be undone and will also delete all products in this store.</p>
    
    <form method="POST">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete Store</button>
        <a href="{% url 'edit_store' store.id %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
